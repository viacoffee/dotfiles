# Iron Mars Theme Palette
# Dusty Martian colony — warm rusts, aged copper, and dried earth tones.
# Run `coffee-theme-refresh` after editing to regenerate configs.

[meta]
name = "iron-mars"

[colors]
# Backgrounds
bg        = "#1a1614"
bg_alt    = "#211d1a"
bg_dark   = "#2b2521"
surface   = "#3a322c"

# Foregrounds
fg        = "#c4b5a6"
fg_accent = "#ddd0c3"
fg_light  = "#f0e8e0"

# Grays
gray      = "#6e635a"
gray_mid  = "#998d82"
inactive  = "#3e3631"
proc_misc = "#8a7f74"

# Normal palette
red       = "#d9685e"
green     = "#a4b56e"
yellow    = "#d4b06a"
blue      = "#7a9eb8"
magenta   = "#b88da4"
cyan      = "#82afa8"

# Dim variants
dim_red     = "#994a42"
dim_green   = "#73804e"
dim_yellow  = "#957b4a"
dim_blue    = "#566f81"
dim_magenta = "#816374"
dim_cyan    = "#5b7b76"

# Bright foreground
bright_fg = "#e8ddd2"
