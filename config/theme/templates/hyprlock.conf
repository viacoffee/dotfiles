# Background color
$color = ${BG_DARK_RGBA_1}

# Inner overlay color
$inner_color = ${BLACK_RGBA_04}

# Outer border/accent color
$outer_color = ${BLACK_RGBA_0}

# Font color (main foreground)
$font_color = ${FG_ACCENT_RGBA_1}

# Checkmark/success color (green accent)
$check_color = ${DIM_GREEN_RGBA_1}

# Clock color
$clock_color = ${FG_ACCENT_RGBA_1}

# Font
$font = InputMono Nerd Font

general {
  ignore_empty_input = true
}

background {
  monitor =
  color = $color
  path = ~/background.jpg
  blur_passes = 3
}

animations {
  enabled = false
}

label {
  monitor =
  text = $TIME
  font_size = 40
  color = $clock_color
  font_family = $font
  position = 0, 70
}

input-field {
  monitor =
  size = 270, 30
  position = 0, 0
  halign = center
  valign = center

  inner_color = $inner_color
  outer_color = $outer_color
  outline_thickness = 1

  font_family = $font
  font_color = $font_color

  dots_size = 0.2

  placeholder_text = Enter Password
  check_color = $check_color
  fail_color = ${DIM_RED_RGBA_1}
  fail_text = <i>$FAIL ($ATTEMPTS)</i>

  rounding = 3
  shadow_passes = 0
  fade_on_empty = true
}

auth {
  fingerprint:enabled = true
}
