[env]
TERM = "xterm-256color"

[font]
normal = { family = "SpaceMono Nerd Font Mono" }
bold = { family = "SpaceMono Nerd Font Mono" }
italic = { family = "SpaceMono Nerd Font Mono" }
size = 10

[font.offset]
x = 0
y = 0

[font.glyph_offset]
x = 0
y = 0

[window]
padding.x = 7
padding.y = 5
dynamic_padding = true
decorations = "None"

[keyboard]
bindings = [
  { key = "Insert", mods = "Shift", action = "Paste" },
  { key = "Insert", mods = "Control", action = "Copy" }
]

[cursor]
thickness = 0.20

[colors.primary]
foreground = "${FG}"
background = "${BG}"
dim_foreground = "${GRAY}"
bright_foreground = "${BRIGHT_FG}"

[colors.cursor]
text = "${BG_DARK}"
cursor = "${FG}"

[colors.vi_mode_cursor]
text = "${BG_DARK}"
cursor = "${BLUE}"

[colors.search.matches]
foreground = "${FG}"
background = "${SURFACE}"

[colors.search.focused_match]
foreground = "${BG_DARK}"
background = "${YELLOW}"

[colors.hints.start]
foreground = "${FG}"
background = "${SURFACE}"

[colors.hints.end]
foreground = "${BRIGHT_FG}"
background = "${SURFACE}"

[colors.line_indicator]
foreground = "None"
background = "None"

[colors.footer_bar]
foreground = "${FG}"
background = "${BG_ALT}"

[colors.selection]
text = "${FG}"
background = "${SURFACE}"

[colors.normal]
black   = "${BG_DARK}"
red     = "${RED}"
green   = "${GREEN}"
yellow  = "${YELLOW}"
blue    = "${BLUE}"
magenta = "${MAGENTA}"
cyan    = "${CYAN}"
white   = "${FG}"

[colors.bright]
black   = "${GRAY}"
red     = "${RED}"
green   = "${GREEN}"
yellow  = "${YELLOW}"
blue    = "${BLUE}"
magenta = "${MAGENTA}"
cyan    = "${CYAN}"
white   = "${BRIGHT_FG}"

[colors.dim]
black   = "${BG_ALT}"
red     = "${DIM_RED}"
green   = "${DIM_GREEN}"
yellow  = "${DIM_YELLOW}"
blue    = "${DIM_BLUE}"
magenta = "${DIM_MAGENTA}"
cyan    = "${DIM_CYAN}"
white   = "${GRAY_MID}"
