[main]
font=InputMono Nerd Font:size=10
letter-spacing=0.7
prompt=""
width=20
minimal-lines=yes

keyboard-focus=exclusive
placeholder=" Go…"

horizontal-pad=30
vertical-pad=15
inner-pad=10
line-height=60px

sort-result=no

[colors]
background=${BLACK_D0}
text=${FG_LIGHT_FF}
prompt=${BLUE_FF}
input=${FG_LIGHT_FF}
match=${CYAN_FF}
selection=00000000
selection-text=${CYAN_FF}
selection-match=${CYAN_FF}
placeholder=${FG_LIGHT_A2}

border=${BLACK_F2}

[border]
width=1
radius=4

[key-bindings]
prev=none
next=none
prev-with-wrap=Up
next-with-wrap=Down
