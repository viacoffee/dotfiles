# Neon Petrichor Theme Palette
# Rain-slicked cyberpunk streets — deep violet darks with vivid neon reflections.
# Run `coffee-theme-refresh` after editing to regenerate configs.

[meta]
name = "neon-petrichor"

[colors]
# Backgrounds
bg        = "#151521"
bg_alt    = "#1c1c2e"
bg_dark   = "#252538"
surface   = "#32324a"

# Foregrounds
fg        = "#b4b8d4"
fg_accent = "#cdd0e6"
fg_light  = "#e2e4f0"

# Grays
gray      = "#585c78"
gray_mid  = "#8488a4"
inactive  = "#2e2e44"
proc_misc = "#787c98"

# Normal palette
red       = "#f06292"
green     = "#a5d6a7"
yellow    = "#ffe082"
blue      = "#82b1ff"
magenta   = "#ce93d8"
cyan      = "#80cbc4"

# Dim variants
dim_red     = "#a84466"
dim_green   = "#739675"
dim_yellow  = "#b39c5b"
dim_blue    = "#5b7cb3"
dim_magenta = "#907098"
dim_cyan    = "#5a8e88"

# Bright foreground
bright_fg = "#d8daea"
