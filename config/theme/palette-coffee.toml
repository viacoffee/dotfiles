# Coffee Theme Palette
# Single source of truth for all system colors.
# Run `coffee-theme-refresh` after editing to regenerate configs.

[meta]
name = "coffee"

[colors]
# Backgrounds
bg        = "#1e2229"
bg_alt    = "#21252b"
bg_dark   = "#282c34"
surface   = "#3e4451"

# Foregrounds
fg        = "#abb2bf"
fg_accent = "#c5c8c6"
fg_light  = "#cfd8dc"

# Grays
gray      = "#5c6370"
gray_mid  = "#9aa2ad"
inactive  = "#373b41"
proc_misc = "#969896"

# Normal palette
red       = "#e06c75"
green     = "#98c379"
yellow    = "#e5c07b"
blue      = "#61afef"
magenta   = "#c678dd"
cyan      = "#56b6c2"

# Dim variants
dim_red     = "#be5046"
dim_green   = "#7da869"
dim_yellow  = "#d19a66"
dim_blue    = "#528bff"
dim_magenta = "#a678dd"
dim_cyan    = "#4aa5b7"

# Bright foreground
bright_fg = "#c8ccd4"
