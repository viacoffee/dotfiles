[env]
TERM = "xterm-256color"

[font]
normal = { family = "SpaceMono Nerd Font Mono" }
bold = { family = "SpaceMono Nerd Font Mono" }
italic = { family = "SpaceMono Nerd Font Mono" }
size = 16

[font.offset]
x = 0
y = 2

[font.glyph_offset]
x = 0
y = 0

[window]
padding.x = 7
padding.y = 5
dynamic_padding = true
decorations = "None"

[keyboard]
bindings = [
  { key = "Return", mods = "Shift", chars = "\u001B\r"},
  { key = "Insert", mods = "Shift", action = "Paste" },
  { key = "Insert", mods = "Control", action = "Copy" }
]

[cursor]
thickness = 0.20

[colors]
draw_bold_text_with_bright_colors = false

[colors.primary]
foreground = "#a1aab7"
background = "#1b212a"
dim_foreground = "#88929f"
bright_foreground = "#c9cfda"

[colors.cursor]
text = "#1b212a"
cursor = "#a1aab7"

[colors.vi_mode_cursor]
text = "#12161c"
cursor = "#6e99c3"

[colors.search.matches]
foreground = "#c9cfda"
background = "#3f4751"

[colors.search.focused_match]
foreground = "#12161c"
background = "#d9a86c"

[colors.hints.start]
foreground = "#12161c"
background = "#d9a86c"

[colors.hints.end]
foreground = "#c9cfda"
background = "#3f4751"

[colors.line_indicator]
foreground = "None"
background = "None"

[colors.footer_bar]
foreground = "#88929f"
background = "#191d24"

[colors.selection]
text = "#c9cfda"
background = "#3f4751"

[colors.normal]
black   = "#12161c"
red     = "#d77c73"
green   = "#99bc76"
yellow  = "#d9a86c"
blue    = "#6e99c3"
magenta = "#b887c0"
cyan    = "#70b6b9"
white   = "#88929f"

[colors.bright]
black   = "#79838f"
red     = "#df9792"
green   = "#abcc8a"
yellow  = "#eac390"
blue    = "#87aed6"
magenta = "#c99dd2"
cyan    = "#86c8cc"
white   = "#c9cfda"

[colors.dim]
black   = "#0e1116"
red     = "#ba5e56"
green   = "#7e9963"
yellow  = "#b39065"
blue    = "#5c7ea0"
magenta = "#966f9e"
cyan    = "#5c9599"
white   = "#6d7681"
