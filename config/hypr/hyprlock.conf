input-field {
  monitor =
  size = 260, 35
  position = 0, 95
  halign = center
  valign = bottom

  inner_color = rgba(0, 0, 0, 0.0)
  outer_color = $outer_color
  outline_thickness = 1

  font_family = $font
  font_color = $font_color
  dots_size = 0.2
  placeholder_text = 
  check_color = $check_color
  fail_color = rgba(190, 80, 70, 1.0)
  fail_text = <i>$FAIL ($ATTEMPTS)</i>

  rounding = 6
  shadow_passes = 0
  fade_on_empty = true
}

auth {
  fingerprint:enabled = true
}
