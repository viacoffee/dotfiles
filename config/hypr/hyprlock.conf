$color = rgba(0, 0, 0, 1.0)
$inner_color = rgba(0, 0, 0, 0.4)
$outer_color = rgba(112, 112, 112, 0.45)
$font_color = rgba(207, 216, 220, 1.0)
$check_color = rgba(125, 168, 105, 1.0)
$font = RobotoMono Nerd Font Mono, monospace

general {
  ignore_empty_input = true
}

background {
  monitor =
  color = $color
  path = ~/background.jpg
  blur_passes = 1
}

animations {
  enabled = false
}

# Centered clock and date.
label {
  monitor =
  text = cmd[update:1000] date +%H:%M
  font_size = 56
  font_family = $font
  color = $font_color
  position = 0, 80
  halign = center
  valign = center
}

label {
  monitor =
  text = cmd[update:60000] date +"%a,  %d  %b"
  font_size = 16
  color = $font_color
  font_family = $font
