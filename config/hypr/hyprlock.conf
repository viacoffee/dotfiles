$color = rgb(1b212a)
$other_color = rgb(88929f)
$clock_color = rgb(c9cfda)
$outer_color = rgba(136, 146, 159, 0.8)
$check_color = rgba(125, 168, 105, 1.0)
$font = RobotoMono Nerd Font Mono, monospace

general {
  ignore_empty_input = true
}

background {
  monitor =
  color = $color
}

animations {
  enabled = false
}

# Clock and date, left of center.
label {
  monitor =
  text = cmd[update:1000] date +%H:%M
  font_size = 72
  font_family = $font
  color = $clock_color
  position = 12%, 0
  halign = left
  valign = center
}

label {
  monitor =
  text = cmd[update:60000] sh -c 'date +"%A, %B %d" | sed "s/./& /g"'
  font_size = 16
  color = $other_color
  font_family = $font
  position = 12%, -70
  halign = left
  valign = center
}

# Battery indicator in the upper-right corner.
label {
  monitor =
  text = cmd[update:30000] sh -c 'capacity=$(cat /sys/class/power_supply/BAT1/capacity); status=$(cat /sys/class/power_supply/BAT1/status); if [ "$status" = Charging ]; then icon="󰂅"; elif [ "$capacity" -ge 90 ]; then icon="󰁹"; elif [ "$capacity" -ge 80 ]; then icon="󰂂"; elif [ "$capacity" -ge 70 ]; then icon="󰂁"; elif [ "$capacity" -ge 60 ]; then icon="󰂀"; elif [ "$capacity" -ge 50 ]; then icon="󰁿"; elif [ "$capacity" -ge 40 ]; then icon="󰁾"; elif [ "$capacity" -ge 30 ]; then icon="󰁽"; elif [ "$capacity" -ge 20 ]; then icon="󰁼"; else icon="󰁺"; fi; printf "%s %s%%" "$icon" "$capacity"'
  font_size = 16
  font_family = $font
  color = $other_color
  position = -32, -26
  halign = right
  valign = top
}

input-field {
  monitor =
  size = 310, 46
  position = 0, 67
  halign = center
  valign = bottom

  inner_color = rgba(0, 0, 0, 0.0)
  outer_color = $outer_color
  outline_thickness = 1

  font_family = $font
  font_color = $other_color
  dots_size = 0.2
  placeholder_text = enter password
  check_color = $check_color
  fail_color = rgba(190, 80, 70, 1.0)
  fail_text = <i>$FAIL ($ATTEMPTS)</i>

  rounding = 0
  shadow_passes = 0
  fade_on_empty = true
}

auth {
  fingerprint:enabled = true
}
