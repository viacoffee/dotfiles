# Background color
$color = rgba(40, 44, 52, 1.0)

# Inner overlay color
$inner_color = rgba(40, 44, 52, 0.8)

# Outer border/accent color
$outer_color = rgba(97, 175, 239, 1.0)

# Font color (main foreground)
$font_color = rgba(171, 178, 191, 1.0)

# Checkmark/success color (green accent)
$check_color = rgba(152, 195, 121, 1.0)

general {
    ignore_empty_input = true
}

background {
    monitor =
    color = $color
    path = ~/.config/coffee/background.jpg
    blur_passes = 3
}

animations {
    enabled = false
}

input-field {
    monitor =
    size = 450, 50
    position = 0, 0
    halign = center
    valign = center

    inner_color = $inner_color
    outer_color = $outer_color
    outline_thickness = 1

    font_family = SpaceMono Nerd Font Mono
    font_color = $font_color

    placeholder_text = Enter Password
    check_color = $check_color
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
}

auth {
    fingerprint:enabled = true
}
