# Battery indicator in the upper-right corner.
label {
  monitor =
  text = cmd[update:30000] sh -c 'capacity=$(cat /sys/class/power_supply/BAT1/capacity); status=$(cat /sys/class/power_supply/BAT1/status); if [ "$status" = Charging ]; then printf "󰂅"; elif [ "$capacity" -ge 90 ]; then printf "󰁹"; elif [ "$capacity" -ge 80 ]; then printf "󰂂"; elif [ "$capacity" -ge 70 ]; then printf "󰂁"; elif [ "$capacity" -ge 60 ]; then printf "󰂀"; elif [ "$capacity" -ge 50 ]; then printf "󰁿"; elif [ "$capacity" -ge 40 ]; then printf "󰁾"; elif [ "$capacity" -ge 30 ]; then printf "󰁽"; elif [ "$capacity" -ge 20 ]; then printf "󰁼"; else printf "󰁺"; fi'
  font_size = 16
  font_family = $font
  color = $font_color
  position = -32, -26
  halign = right
  valign = top
}

input-field {
  monitor =
  size = 310, 46
  position = 0, 67
  halign = center
  valign = bottom

  inner_color = rgba(0, 0, 0, 0.0)
  outer_color = $outer_color
  outline_thickness = 1

  font_family = $font
  font_color = $font_color
  dots_size = 0.2
  placeholder_text = Enter password...
  check_color = $check_color
  fail_color = rgba(190, 80, 70, 1.0)
  fail_text = <i>$FAIL ($ATTEMPTS)</i>

  rounding = 6
  shadow_passes = 0
  fade_on_empty = true
}

auth {
  fingerprint:enabled = true
}
